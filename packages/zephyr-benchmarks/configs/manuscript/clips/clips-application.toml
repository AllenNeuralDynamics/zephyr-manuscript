# The VR-foraging sessions without a thermistor (Fig. 5, Fig. S10): every camera of 19
# sessions, each video the raw session's on aind-open-data, mounted at /data/<session>
# (the capsule attaches each session's data asset under its name). Boxes, frames and
# frame rates are the ones placed and checked for the paper (the app's Boxes page);
# each clip's group is <session>_<camera>, so each predicts into its own folder.
[preprocess]
target_size = [360, 270]
select_fs = 60.0
onset_sigma_s = 0.02
output_fs = 60.0

