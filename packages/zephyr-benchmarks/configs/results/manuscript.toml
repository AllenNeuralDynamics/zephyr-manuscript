# Figs. 4-5, S9-S10: quality-control scores, made on Code Ocean by `zephyr predict
# --quality-control` (the noise null by `zephyr-benchmarks probe`, in
# notebooks/analyses.py). The reference is the all-camera network of cv_0's (its
# validation windows); each refined dynamic-foraging network scored its reports against
# its own reference. The truth they are checked against is joined by the report, never
# read by quality control. Each folder is under root; a glob names several.
[quality]
reference = "all-cameras/cv_0/seed-17/qc-reference.json"

[[quality.set]]
label = "Held-out animals"
reports = "all-cameras/cv_0/seed-17/quality/test_a"
role = "working"

[[quality.set]]
label = "Dynamic foraging, refined"
reports = "dynamic-foraging/cv_0-df-*/seed-17/quality/df_test_a"
role = "working"

[[quality.set]]
label = "Dynamic foraging, unrefined"
reports = "dynamic-foraging-unrefined/behavior_*"
role = "null"

[[quality.set]]
label = "Noise 16"
reports = "analysis/noise-null/test_a"
role = "null"
noise = 16

[[quality.set]]
label = "Noise 32"
reports = "analysis/noise-null/test_a"
role = "null"
noise = 32

[[quality.set]]
label = "Noise 64"
reports = "analysis/noise-null/test_a"
role = "null"
noise = 64

[[quality.set]]
label = "Sessions without a thermistor"
reports = "application/*_FaceCamera"
role = "application"
camera = "Face camera"

[[quality.set]]
label = "Sessions without a thermistor, side camera"
reports = "application/*_SideCamera"
role = "camera"
camera = "Side camera"

[[quality.set]]
label = "Sessions without a thermistor, front camera"
reports = "application/*_FrontCamera"
role = "camera"
camera = "Front camera"
