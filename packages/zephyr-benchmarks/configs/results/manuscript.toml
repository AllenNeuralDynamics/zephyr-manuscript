# The paper's results: every run it reports, all trained and scored on Code Ocean from
# one capsule commit (zephyr b25af8a, this repository's configs/manuscript/), seed 17,
# and the analyses notebooks/analyses.py adds beside them (analysis/). Every method is
# compared over the five cross-validation folds; there is no single split. A run that
# has not finished is left out until it has.
root = "${ZEPHYR_BUCKET}/zephyr-manuscript-runs"

# Figs. 2-3, Table 1, Table S3: each method retrained on every fold (experiments/
# face.toml and the comparisons matrix), each of the 48 animals outside the 359-Hz group
# a test-A animal once. Only Zephyr has an onset head: the comparison networks are as
# their papers built them.
[cross_validation]
folds = ["cv_0", "cv_1", "cv_2", "cv_3", "cv_4"]

[[cross_validation.method]]
label = "Zephyr"
run = "face"
head = true

[[cross_validation.method]]
label = "PhysNet"
run = "physnet"

[[cross_validation.method]]
label = "TS-CAN"
run = "tscan"

[[cross_validation.method]]
label = "PhysFormer"
run = "physformer"

[[cross_validation.method]]
label = "RhythmFormer"
run = "rhythmformer"

[[cross_validation.method]]
label = "Facemap"
run = "pixel-facemap"
kind = "facemap"
variant = "both"

[[cross_validation.method]]
label = "Pixel (motion)"
run = "pixel-facemap"
kind = "pixel"
variant = "motion/calibrated"

[[cross_validation.method]]
label = "Pixel (SNR)"
run = "pixel-facemap"
kind = "pixel"
variant = "snr/calibrated"

# Fig. S3: Zephyr fed 30-Hz video (select_fs = 30), still predicting on the 60-Hz grid.
[[cross_validation.variant]]
label = "Zephyr, 30-Hz input"
run = "face-30hz"
head = true

# Fig. 3d-e, Fig. S4, Table S4: the same recipe on the side and front cameras' own boxed
# crops (96 x 96 pixels of frames downsampled to 720 x 540), scored on the same spans
# against the same thermistor.
[[cross_validation.variant]]
label = "Zephyr, side camera"
run = "side"
head = true

[[cross_validation.variant]]
label = "Zephyr, front camera"
run = "front"
head = true

# Fig. 3f: one Zephyr trained on the pooled clips of all three cameras, scored on each.
[[cross_validation.variant]]
label = "Zephyr, all cameras"
run = "all-cameras"
head = true

# Fig. 3g-i, Fig. S8: dynamic foraging, a new task and rig, leave-one-out over its three
# animals. "On DF" is the all-camera network of cv_0 as it is, scored on each left-out
# animal by notebooks/analyses.py; "refined on DF" is it trained further on the other two
# animals (experiments/dynamic-foraging.toml).
[[variant]]
label = "Zephyr, all cameras, on DF (810750)"
run = "analysis/df-unrefined-scores"
fold = "cv_0-df-810750"
head = true

[[variant]]
label = "Zephyr, all cameras, on DF (811021)"
run = "analysis/df-unrefined-scores"
fold = "cv_0-df-811021"
head = true

[[variant]]
label = "Zephyr, all cameras, on DF (811026)"
run = "analysis/df-unrefined-scores"
fold = "cv_0-df-811026"
head = true

[[variant]]
label = "Zephyr, all cameras, refined on DF (810750)"
run = "dynamic-foraging"
fold = "cv_0-df-810750"
head = true

[[variant]]
label = "Zephyr, all cameras, refined on DF (811021)"
run = "dynamic-foraging"
fold = "cv_0-df-811021"
head = true

[[variant]]
label = "Zephyr, all cameras, refined on DF (811026)"
run = "dynamic-foraging"
fold = "cv_0-df-811026"
head = true

