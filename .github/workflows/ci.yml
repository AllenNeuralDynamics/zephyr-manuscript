name: Manuscript CI

on:
  pull_request:
  push:
    branches:
      - main
  release:
    types: [published]
  workflow_dispatch:

jobs:
  manuscript:
    runs-on: ubuntu-latest
    name: Build manuscript PDF and Word
    permissions:
      # write is needed only to attach files to a release
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: typst-community/setup-typst@v5.3.0
        with:
          typst-version: "0.15.0"

      - name: Compile manuscript
        run: >-
          typst compile --font-path manuscript/template/fonts
          --input version="$(git describe --always --dirty --abbrev=40 --exclude='*')"
          manuscript/main.typ "${{ runner.temp }}/manuscript.pdf"

      - name: Upload manuscript as artifact
        uses: actions/upload-artifact@v7
        with:
          path: ${{ runner.temp }}/manuscript.pdf
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Export the HTML page
        # The template's HTML export; the web page and the Word file are both made from it.
        run: >-
          typst compile --features html --format html --font-path manuscript/template/fonts
          --input version="$(git describe --always --dirty --abbrev=40 --exclude='*')"
          manuscript/main.typ "${{ runner.temp }}/manuscript.html"

      - uses: r-lib/actions/setup-pandoc@v2
        with:
          # Pinned to the version the script was tested with (Ubuntu's apt package is 3.1.3).
          pandoc-version: "3.13"

      - name: Build the Word version
        # Typst has no DOCX export: HTML -> Pandoc. Figures are rasterised first (script docstring).
        run: |
          python3 scripts/build_docx.py "${{ runner.temp }}/manuscript.html" "${{ runner.temp }}/manuscript.docx" \
            --font-path manuscript/template/fonts \
            --version "$(git describe --always --dirty --abbrev=40 --exclude='*')"

      - name: Upload Word version as artifact
        uses: actions/upload-artifact@v7
        with:
          path: ${{ runner.temp }}/manuscript.docx
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Attach PDF and Word to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          cp "${{ runner.temp }}/manuscript.pdf" "zephyr-${TAG}.pdf"
          cp "${{ runner.temp }}/manuscript.docx" "zephyr-${TAG}.docx"
          gh release upload "$TAG" "zephyr-${TAG}.pdf" "zephyr-${TAG}.docx" --clobber

      - name: Assemble the web page
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        # The paper as one HTML page, with the PDF and the Word file beside it.
        run: |
          mkdir -p site
          cp "${{ runner.temp }}/manuscript.pdf" site/zephyr.pdf
          cp "${{ runner.temp }}/manuscript.docx" site/zephyr.docx
          cp "${{ runner.temp }}/manuscript.html" site/index.html
          link="<p class=\"keywords\"><a href=\"zephyr.pdf\">PDF</a> · <a href=\"zephyr.docx\">Word</a> · built from <a href=\"https://github.com/${{ github.repository }}/commit/${{ github.sha }}\"><code>${GITHUB_SHA::7}</code></a></p>"
          sed -i "0,/<body>/s||<body>${link}|" site/index.html
          grep -q 'href="zephyr.pdf"' site/index.html
          grep -q 'href="zephyr.docx"' site/index.html

      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: site

  pages:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: manuscript
    runs-on: ubuntu-latest
    name: Publish the manuscript to GitHub Pages
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  tests:
    runs-on: ubuntu-latest
    name: Benchmark and notebook tests
    env:
      # `uv run` would otherwise re-sync without --extra cpu and uninstall torch.
      UV_NO_SYNC: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install python dependencies
        run: uv sync --python 3.13 --all-packages --extra cpu

      - name: Run ruff format
        run: uv run ruff format --check

      - name: Run ruff check
        run: uv run ruff check

      - name: Run python unit tests
        run: uv run pytest

      - name: Check for uncommitted changes
        shell: bash
        run: |
          git config --global core.safecrlf false
          git diff --exit-code || (echo "Untracked changes found" && exit 1)
