name: Manuscript CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  manuscript:
    runs-on: ubuntu-latest
    name: Build manuscript PDF
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: typst-community/setup-typst@v5.3.0
        with:
          typst-version: "0.15.0"

      - name: Compile manuscript
        run: >-
          typst compile --font-path manuscript/template/fonts
          --input version="$(git describe --always --dirty --abbrev=40 --exclude='*')"
          manuscript/main.typ "${{ runner.temp }}/manuscript.pdf"

      - name: Upload manuscript as artifact
        uses: actions/upload-artifact@v7
        with:
          path: ${{ runner.temp }}/manuscript.pdf
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Assemble the web page
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        # The paper as one HTML page (the template's HTML export), with the PDF beside it.
        run: |
          mkdir -p site
          cp "${{ runner.temp }}/manuscript.pdf" site/zephyr.pdf
          typst compile --features html --format html --font-path manuscript/template/fonts \
            --input version="$(git describe --always --dirty --abbrev=40 --exclude='*')" \
            manuscript/main.typ site/index.html
          link="<p class=\"keywords\"><a href=\"zephyr.pdf\">PDF</a> · built from <a href=\"https://github.com/${{ github.repository }}/commit/${{ github.sha }}\"><code>${GITHUB_SHA::7}</code></a></p>"
          sed -i "0,/<body>/s||<body>${link}|" site/index.html
          grep -q 'href="zephyr.pdf"' site/index.html

      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: site

  pages:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: manuscript
    runs-on: ubuntu-latest
    name: Publish the manuscript to GitHub Pages
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  tests:
    runs-on: ubuntu-latest
    name: Benchmark and notebook tests (py${{ matrix.python-version }})
    env:
      # `uv run` would otherwise re-sync without --extra cpu and uninstall torch.
      UV_NO_SYNC: "1"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install python dependencies
        run: uv sync --python ${{ matrix.python-version }} --all-packages --extra cpu

      - name: Run ruff format
        run: uv run ruff format --check

      - name: Run ruff check
        run: uv run ruff check

      - name: Run python unit tests
        run: uv run pytest

      - name: Check for uncommitted changes
        shell: bash
        run: |
          git config --global core.safecrlf false
          git diff --exit-code || (echo "Untracked changes found" && exit 1)
